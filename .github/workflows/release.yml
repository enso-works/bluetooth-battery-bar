name: Release

# Merging to main releases when VERSION has no tag yet: the app is signed with Developer ID,
# notarized, published as a GitHub release, and the cask in enso-works/homebrew-tap is updated.
# Pull requests are built (ad-hoc signed) to catch build breaks.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - "packaging/**"
      - "Package.swift"
      - "Makefile"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and release notes
        id: check
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## $VERSION\$" CHANGELOG.md || { echo "::error file=CHANGELOG.md::No '## $VERSION' section in CHANGELOG.md"; exit 1; }
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Releasing v$VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merging this releases v$VERSION."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A release must be signed, notarized and update the cask, never published ad-hoc signed.
      - name: Check release secrets
        if: env.RELEASE == 'true'
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER TAP_DEPLOY_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Repository secret $name is missing."; exit 1; }
          done

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.MACOS_CERT_P12 != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials bluetooth-battery-bar-notary \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm -f "$KEY"
          echo "NOTARY_PROFILE=bluetooth-battery-bar-notary" >> "$GITHUB_ENV"

      - name: Build and package
        run: make dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BluetoothBatteryBar-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # A draft first, so every file is attached before the release becomes "latest".
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Bluetooth Battery Bar $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Update Homebrew cask
        if: env.RELEASE == 'true'
        run: |
          SHA="$(shasum -a 256 "dist/BluetoothBatteryBar-$VERSION.dmg" | cut -d' ' -f1)"
          KEY="$RUNNER_TEMP/tap_key"
          echo "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:enso-works/homebrew-tap.git "$RUNNER_TEMP/tap"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/bluetooth-battery-bar.rb \
            > "$RUNNER_TEMP/tap/Casks/bluetooth-battery-bar.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bluetooth-battery-bar.rb
          git diff --cached --quiet || { git commit -m "bluetooth-battery-bar $VERSION" && git push; }
          rm -f "$KEY"
